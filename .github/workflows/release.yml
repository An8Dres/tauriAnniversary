name: "Build Android APK"

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Configurar Android NDK
        # Le decimos a Tauri dónde están las herramientas móviles gratuitas de GitHub
        run: echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar Tauri de forma global
        run: npm install -g @tauri-apps/cli

      - name: Generar proyecto Android en la Nube
        # Esto hace lo que cancelaste en tu Pentium, pero en el servidor súper rápido de GitHub
        run: tauri android init

      - name: Compilar el APK
        # Este es el comando REAL para móviles, no el de escritorio
        run: tauri android build

      - name: Guardar el APK para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: Mi-App-VanillaJS-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk