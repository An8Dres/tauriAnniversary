name: "Build Android APK"

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI (Rust version)
        # Instalamos la CLI de Rust para evitar errores de Node.js/PATH
        run: cargo install tauri-cli --version 2.0.0 --locked

      - name: Init Android Project
        # Genera la carpeta 'gen/android' que no tienes en tu Pentium
        run: cargo tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Build APK
        # Comando directo de Rust para generar el archivo .apk
        run: cargo tauri android build
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Aniversario-Android
          # Esta ruta es donde Gradle guarda el APK final por defecto
          path: src-tauri/gen/android/app/build/outputs/apk/release/*.apk